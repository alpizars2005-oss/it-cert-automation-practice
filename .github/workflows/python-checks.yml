name: Python practice checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python practice files
        shell: bash
        run: |
          mapfile -d '' files < <(find Course3 Course4 Course5 -type f -name '*.py' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Python files found" >&2
            exit 1
          fi
          python -m py_compile "${files[@]}"
